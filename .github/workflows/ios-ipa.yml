# Builds an unsigned .ipa on a macOS runner so it can be sideloaded from a
# Windows machine. Nobody on the team has a Mac to hand, and Flutter cannot
# compile for iOS anywhere else.
#
# Run it from the Actions tab: "Build iOS app (unsigned)" -> Run workflow.
# Download the .ipa from the run's Artifacts section, then sign and install
# it with Sideloadly or AltStore. The build is deliberately unsigned: the
# sideloading tool re-signs it with your own free Apple ID.
name: Build iOS app (unsigned)

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "Backend URL the app should call (your laptop's LAN address, e.g. http://192.168.1.41:3000)"
        required: true
        default: "http://192.168.1.41:3000"

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show toolchain
        run: flutter --version

      # flutter_webrtc, livekit_client and permission_handler_apple have no
      # Swift Package Manager support, so leaving SPM on builds a mixed
      # SPM/CocoaPods workspace for no benefit. Keep it on CocoaPods alone.
      - name: Use CocoaPods only
        run: flutter config --no-enable-swift-package-manager

      - name: Install dependencies
        run: flutter pub get

      # Writes ios/Flutter/Generated.xcconfig - including the dart-defines,
      # which xcodebuild reads from there - and runs pod install. It does not
      # compile: the Dart build happens inside the Xcode build phase below.
      - name: Prepare iOS config
        run: |
          flutter build ios --config-only --release --no-codesign \
            --dart-define=API_BASE_URL=${{ inputs.api_base_url }}

      # Built through xcodebuild rather than `flutter build ios --no-codesign`.
      # That flag does not reliably stop Xcode demanding a Development Team,
      # and there is no team to give it: the app is signed later, on the
      # Windows machine, with a personal Apple ID. Turning signing off at the
      # xcodebuild level is unambiguous.
      - name: Build unsigned
        run: |
          set -o pipefail
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/ios_dd \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            EXPANDED_CODE_SIGN_IDENTITY="" \
            build

      # An .ipa is just the .app inside a Payload/ directory, zipped.
      - name: Package as .ipa
        run: |
          APP=build/ios_dd/Build/Products/Release-iphoneos/Runner.app
          test -d "$APP" || { echo "No Runner.app at $APP"; ls -R build/ios_dd/Build/Products || true; exit 1; }
          mkdir -p build/ipa/Payload
          cp -R "$APP" build/ipa/Payload/
          cd build/ipa
          zip -qry TogetherIRL.ipa Payload
          ls -lh TogetherIRL.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: TogetherIRL-ipa
          path: build/ipa/TogetherIRL.ipa
          retention-days: 14
